version: 2
kind: local-deployment-contract
name: ai-agent-platform
source_of_truth: true
scope: non-docker-development
reviewed_on: "2026-09-21"

document_precedence:
  canonical:
    - docs/local-deployment-contract.yaml
    - docs/quickstart/deployment-guide.md
  supporting:
    - docs/quickstart/local-dev.md
    - docs/quickstart/env-matrix.md
    - docs/guides/database-operations.md
  rule: Documents must agree with scripts/local-stack.sh and app config; report drift instead of executing obsolete commands.

agent_entrypoint:
  guide: docs/guides/ai-deployment-assistant-instruction.md
  one_line_user_prompt: 阅读 docs/guides/ai-deployment-assistant-instruction.md 帮我部署环境

profiles:
  default-local:
    description: Native processes on a local or SSH-accessed development host
    services: [runtime-service, platform-api, platform-web]
    processes: [runtime-api, runtime-worker, platform-api, platform-web]
    startup_order: [runtime-api, runtime-worker, platform-api, platform-web]
    optional_services: []
    chains:
      - platform-web -> platform-api -> runtime-api -> runtime-worker
    excluded:
      - platform-worker
      - lightrag-service

global:
  dependencies:
    python: "3.13"
    uv: required
    node: "22.x"
    pnpm: "10.5.1"
    postgresql: {required: true, recommended_major: 17, host: 127.0.0.1, port: 5432, authentication: scram-sha-256}
    redis: {required: true, recommended_major: 7, host: 127.0.0.1, port: 6379, db: 7}
    shell_tools: [bash, python3, curl, lsof, pg_isready]
    bootstrap_python_module: dotenv
  helper_scripts: [scripts/local-stack.sh]
  commands: [doctor, migrate, start, status, logs, restart-one, restart, stop]
  rules:
    - Install dependencies first; doctor is not an installer and can reclaim stale owned processes.
    - Activate Runtime venv before running the script if system python3 lacks dotenv.
    - Do not source the repo-root or Platform API .env.
    - Runtime .env is shell-sourced and must use shell-compatible quoting.
    - Do not copy venv, node_modules, databases, Redis state or workspaces across machines.
    - Default startup manages exactly four processes; PostgreSQL and Redis are external prerequisites.
    - Use one active stack per user; temporary PID/log paths are shared across repository copies.
    - This is a development profile, not an approved production deployment.

services:
  runtime-service:
    repo_path: apps/runtime-service
    port: 8123
    config_files: [apps/runtime-service/.env, apps/runtime-service/langgraph.json]
    database: {name: runtime_service, user: runtime_service}
    database_rule: Generic names match .env.example; a private handoff may override both names. Require SCRAM and non-superuser application roles; do not copy developer superuser privileges.
    required_env:
      - DATABASE_URI
      - REDIS_URI
      - PLATFORM_RUNTIME_DELEGATION_SECRET
      - PLATFORM_RUNTIME_DELEGATION_ISSUER
      - PLATFORM_RUNTIME_DELEGATION_AUDIENCE
      - PLATFORM_RUNTIME_MODEL_CONFIG_URL
      - GRAPHHARBOR_RUNTIME_CONTEXT_SECRET
      - GRAPHHARBOR_RUNTIME_CONTEXT_ISSUER
      - GRAPHHARBOR_RUNTIME_CONTEXT_AUDIENCE
      - GRAPHHARBOR_WORKSPACE_ROOT
      - GRAPHHARBOR_RUN_TIMEOUT_SECONDS
      - RUNTIME_WORKSPACE_MAX_FILE_BYTES
      - RUNTIME_WORKSPACE_MAX_FILES
      - RUNTIME_WORKSPACE_MAX_TOTAL_BYTES
      - RUNTIME_WORKSPACE_TTL_SECONDS
    execution: {showcase_backend: local, terminal_backend: local}
    migrations:
      - graphharbor migrate upgrade
      - python -m runtime_service.messaging
    migration_note: messaging initializes the Runtime application Alembic chain via upgrade(); includes skills, memory and inbox.
    health_checks: ["http://127.0.0.1:8123/ready"]
    model_source: Platform model catalog; old settings.yaml/settings.local.yaml are not loaded.
  platform-api:
    repo_path: apps/platform-api
    port: 2142
    config_files: [apps/platform-api/.env]
    database: {name: platform_api, user: platform_api}
    required_env:
      - PLATFORM_API_DATABASE_URL
      - PLATFORM_API_PLATFORM_DB_ENABLED
      - PLATFORM_API_PLATFORM_DB_AUTO_CREATE
      - PLATFORM_API_RUNTIME_DELEGATION_SECRET
      - PLATFORM_API_LANGGRAPH_UPSTREAM_URL
      - PLATFORM_API_MODEL_CONFIG_MASTER_KEY
      - PLATFORM_API_JWT_ACCESS_SECRET
      - PLATFORM_API_JWT_REFRESH_SECRET
      - PLATFORM_API_BOOTSTRAP_ADMIN_PASSWORD
    database_enabled: true
    auto_create: false
    bootstrap_admin: {username: admin, password_source: private-app-env}
    migrations: ["python scripts/database.py upgrade"]
    migration_check: python scripts/database.py check
    health_checks: ["http://127.0.0.1:2142/_system/health"]
  platform-web:
    repo_path: apps/platform-web
    port: 3000
    config_files: [apps/platform-web/.env.local]
    env:
      VITE_PLATFORM_API_URL: /
      VITE_PLATFORM_API_RUNTIME_ENABLED: "true"
      VITE_DEV_PROXY_TARGET: http://127.0.0.1:2142
      VITE_DEV_PORT: "3000"
    remote_access: SSH local forwarding 13000 -> server 127.0.0.1:3000
preflight:
  - Inventory existing infrastructure and installation sources; do not install conflicting instances.
  - Verify approved destination before uploading private configuration.
  - Keep secrets out of public docs, command arguments, logs and Git.
  - Create missing databases and roles before migrations; do not alter existing passwords or owners implicitly.
  - Verify database and Redis endpoints, delegation matching and workspace permissions.
  - Verify correct-password success and missing/wrong-password rejection with password files isolated.
  - Preserve management access and existing databases; scope HBA changes to approved application roles.
  - Ask only for missing materials that block the next step.

acceptance:
  - Platform migration is at head; GraphHarbor and Runtime application migrations succeeded.
  - Runtime API, Runtime Worker, Platform API and Platform Web are running.
  - Readiness JSON contents are successful.
  - Bootstrap login and new project creation work.
  - Configure model connection and project/Agent model selection in the platform.
  - A real new chat streams and completes; refresh shows only newly created history.
  - Report real-model checks not performed.

handoff:
  operator_guide: docs/quickstart/operator-handoff.md
  environment_overrides: Read the private handoff README for actual accounts, paths and code revision.
  data_policy: fresh databases; no old users, projects, chats, checkpoints, Redis or workspace data
  config_policy: privately copy app env; root env preserved separately, never used as shared runtime config
  source_policy: workspace snapshot or clone; no cross-platform dependency directories
  completion_policy: uploading files does not mean deployment has been executed
