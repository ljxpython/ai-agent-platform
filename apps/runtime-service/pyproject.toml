[project]
name = "langgraph-open-teach"
version = "0.1.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain[openai]>=1.2.10",
    "langchain-community>=0.4.1",
    "langchain-mcp-adapters>=0.2.1",
    "langgraph==1.2.11",
    "graphharbor==0.13.0.post32",
    "langgraph-sdk==0.4.3",
    "deepagents>=0.4.4",
    "langchain-deepseek>=1.0.1",
    "langchain-anthropic>=1.0.0",
    "fastapi>=0.133.1",
    "uvicorn[standard]>=0.41.0",
    "requests>=2.32.5",
    "python-dotenv>=1.2.1",
    "langchain-openai>=1.1.10",
    "langfuse>=4.14,<5",
    "langchain-pymupdf4llm>=0.5.0",
    "pillow>=10.0.0",
    "jsonschema>=4.0",
    "pymupdf4llm>=0.1.0,<0.2.0",
    "pyjwt[crypto]>=2.10.1",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.16,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"runtime_service.tools" = ["chart-schemas.json"]
"runtime_service.services.demo.showcase_demo" = ["skills/*/SKILL.md", "examples/*", "README.md"]

"runtime_service.services.dearflow_agent" = ["skills/**/*"]

[tool.setuptools.exclude-package-data]
"runtime_service.services.dearflow_agent" = ["skills/**/__pycache__/*", "skills/**/*.pyc"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["src", "tests"]
markers = [
    "e2e: real-model or real-service end-to-end tests",
    "integration: requires a running Agent Server",
    "durable: requires PostgreSQL/Redis and Agent Server",
]
