services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platform_api
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5432:5432"
    volumes:
      - platform-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform_api"]
      interval: 5s
      timeout: 3s
      retries: 10

  platform-api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env.example
    environment:
      PLATFORM_API_PLATFORM_DB_ENABLED: "true"
      PLATFORM_API_PLATFORM_DB_AUTO_CREATE: "false"
      PLATFORM_API_DATABASE_URL: "postgresql+psycopg://platform:platform@postgres:5432/platform_api"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python scripts/database.py upgrade && exec uvicorn platform_api.main:create_app --factory --host 0.0.0.0 --port 2142"]
    ports:
      - "2142:2142"

volumes:
  platform-postgres-data:
