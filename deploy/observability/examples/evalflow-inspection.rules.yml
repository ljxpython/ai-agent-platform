groups:
  - name: evalflow-inspection-availability
    rules:
      - alert: EvalflowInspectionUnavailable
        expr: up{job="evalflow-inspection"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 巡检受控指标暂不可读取，请核对授权与源服务
