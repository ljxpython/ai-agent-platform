global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'platform-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['127.0.0.1:2142']
        labels:
          service: 'platform-api'

  - job_name: 'runtime-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['127.0.0.1:8123']
        labels:
          service: 'runtime-service'
