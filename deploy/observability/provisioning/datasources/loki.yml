apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: ""
          matcherRegex: 'trace_id[=:]\s*"?([0-9a-f]{32})"'
          name: TraceID
          url: "https://jp.cloud.langfuse.com/trace/${__value.raw}"
          urlDisplayLabel: "Open Trace in Langfuse"
